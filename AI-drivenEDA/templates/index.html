<!DOCTYPE html>
<html>
<head>
    <title>Data Analysis & Visualization App</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .visualization-container {
            width: 100%;
            height: 500px;
        }
        .error {
            color: red;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🎯 Data Analysis & Visualization App</h1>

    <div class="section">
        <h2>1. Upload Data</h2>
        <input type="file" id="fileUpload" accept=".csv">
        <div id="uploadStatus"></div>
    </div>

    <div class="section">
        <h2>2. AI Analysis</h2>
        <input type="text" id="question" placeholder="Ask a question about your data..." style="width: 80%">
        <button onclick="analyzeData()">Analyze</button>
        <div id="analysisResult"></div>
    </div>

    <div class="section">
        <h2>3. Visualization</h2>
        <select id="plotType">
            <option value="Line Chart">Line Chart</option>
            <option value="Bar Chart">Bar Chart</option>
            <option value="Pie Chart">Pie Chart</option>
            <option value="Histogram">Histogram</option>
            <option value="Scatter Plot">Scatter Plot</option>
        </select>
        <select id="xColumn"></select>
        <select id="yColumn"></select>
        <input type="text" id="plotTitle" placeholder="Plot Title">
        <button onclick="createVisualization()">Generate Plot</button>
        <div id="plotContainer" class="visualization-container"></div>
    </div>

    <script>

        $('#fileUpload').change(function() {
            const file = this.files[0];
            const formData = new FormData();
            formData.append('file', file);

            $.ajax({
                url: '/upload',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    if (response.success) {
                        $('#uploadStatus').html('Upload successful! Columns: ' + response.columns.join(', '));
                        // Populate column dropdowns
                        const columns = response.columns;
                        $('#xColumn').empty();
                        $('#yColumn').empty();
                        columns.forEach(col => {
                            $('#xColumn').append(`<option value="${col}">${col}</option>`);
                            $('#yColumn').append(`<option value="${col}">${col}</option>`);
                        });
                    } else {
                        $('#uploadStatus').html('Error: ' + response.message);
                    }
                }
            });
        });

        function analyzeData() {
            const question = $('#question').val();
            $.ajax({
                url: '/analyze',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ question: question }),
                success: function(response) {
                    if (response.success) {
                        $('#analysisResult').html(response.response);
                    } else {
                        $('#analysisResult').html('Error: ' + response.message);
                    }
                }
            });
        }
        function createVisualization() {
            const data = {
                plot_type: $('#plotType').val(),
                x_column: $('#xColumn').val(),
                y_column: $('#yColumn').val(),
                title: $('#plotTitle').val()
            };

            $.ajax({
                url: '/visualize',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(response) {
                    if (response.success) {
                        const plotData = JSON.parse(response.plot);
                        Plotly.newPlot('plotContainer', plotData.data, plotData.layout);
                    } else {
                        $('#plotContainer').html('Error: ' + response.message);
                    }
                }
            });
        }
    </script>
</body>
</html>
